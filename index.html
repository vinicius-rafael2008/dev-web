<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 3</title>
</head>
<body>
    
<form action="#" method="post">

    
    <label for="nome">nome</label>
    <br><br>
    <input type="text"id="nome" placeholder="seu nome completo">
    <br><br>
    <label for="email">E-mail:</label>
    <br><br>
    <input type="email" id="email" placeholder="seuemail@email.com">
    <br><br>
    <label for="senha">senha(min6, só letras e numeros):</label>
    <br><br>
    <input type="password id=senha" pattern="[a-zA-z0-9]{6,}"placeholder="minimo 6 caracteres..."required>
    <br><br>
    <input type="number"id="idade" min="13" max="99"required>
    <br><br>
    <label for="data">data(só em 2026)</label>
    <br><br>
    <input type="date" id="data" min="2026-01-01" max="2026-12-31">
    <br><br>
    <label for="for=telefone">telefone:</label>
    <br><br>
    <input type="tel" id="telefone" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" placeholder="{51}99999 9999">
    <br><br>
    <label for=""></label>
    
   
    
        

            

</form>


</body>
</html>
